<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Categorias — EstoqueFácil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <link href="../../../assets/libraries/bootstrap/bootstrap.min.css" rel="stylesheet" />
  <link href="../../style.css" rel="stylesheet" />
  <link href="categorias.css" rel="stylesheet" />
  <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; line-height: 1; display: inline-block; vertical-align: middle; }
  </style>
</head>
<!-- data-base: prefixo para menu/footer; data-pagina: link ativo no menu -->
<body class="d-flex flex-column min-vh-100" data-base="../../" data-pagina="categorias">

  <!-- Menu compartilhado (../../menu.html), injetado pelo util/shell.js -->
  <div id="appMenu"></div>

  <main class="container-xl py-4 flex-grow-1">
    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">
      <div>
        <h1 class="page-title mb-1">Categorias</h1>
        <p class="text-muted-app small mb-0">Categorias do catálogo local e categorias reais consumidas da API pública (DummyJSON).</p>
      </div>
    </div>

    <!-- Aviso de falha na API pública (tratamento de erros — ID 24) -->
    <div class="alert alert-warning d-flex align-items-center gap-2 d-none" id="alertaApi" role="alert">
      <span class="material-symbols-outlined" style="font-size:20px">wifi_off</span>
      <div>Não foi possível contatar a API pública agora. Exibindo apenas as categorias locais.</div>
    </div>

    <!-- Grade de cards (grid responsivo do Bootstrap: row-cols) -->
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-xl-4 g-3" id="gradeCategorias">
      <div class="col"><div class="card-categoria p-3 text-center text-muted-app py-5">Carregando categorias...</div></div>
    </div>
  </main>

  <div class="app-toast" id="toast" role="status">
    <span class="material-symbols-outlined" id="toastIcon" style="color:#68dba9;font-size:18px">check_circle</span>
    <span id="toastMsg">Operação realizada.</span>
  </div>

  <!-- Rodapé compartilhado (../../footer.html), injetado pelo util/shell.js -->
  <div id="appFooter"></div>

  <script src="../../../assets/libraries/jquery/jquery.min.js"></script>
  <script src="../../../assets/libraries/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="../../config.js"></script>
  <script src="../../model/produto.js"></script>
  <script src="../../util/formatter.js"></script>
  <script src="../../service/api.service.js"></script>
  <script src="../../util/ui.js"></script>
  <script src="../../util/shell.js"></script>
  <script src="categorias.js"></script>
</body>
</html>
